<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification - Vibe</title>
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 40px; border-radius: 20px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .logo-small { width: 60px; height: 60px; background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); margin: 0 auto 20px auto; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        h2 { color: #38bdf8; margin-bottom: 15px; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; text-align: center; font-size: 20px; letter-spacing: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #0ea5e9 0%, #2563eb 100%); border: none; border-radius: 12px; color: white; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        #response-message { margin-top: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-small">🐾</div>
        <h2>Vérification</h2>
        <p>Entrez le code de validation reçu par SMS :</p>
        
        <form id="verify-form">
            <!-- On garde le numéro de téléphone en champ caché pour savoir à quel compte lier le code -->
            <input type="hidden" id="hiddenPhone">
            <input type="text" id="code" placeholder="123456" maxlength="6" required>
            <button type="submit" id="verify-btn">Valider le code</button>
        </form>
        <div id="response-message"></div>
    </div>

    <script>
        // Récupérer le numéro de téléphone transmis dans l'URL (?phone=...)
        const urlParams = new URLSearchParams(window.location.search);
        const phone = urlParams.get('phone');
        
        if(phone) {
            document.getElementById('hiddenPhone').value = phone;
        } else {
            document.getElementById('response-message').style.color = '#ef4444';
            document.getElementById('response-message').textContent = "Numéro introuvable. Veuillez recommencer.";
            document.getElementById('verify-btn').disabled = true;
        }

        const verifyForm = document.getElementById('verify-form');
        const responseMessage = document.getElementById('response-message');
        const verifyBtn = document.getElementById('verify-btn');

        verifyForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Vérification...';
            responseMessage.textContent = '';

            const code = document.getElementById('code').value;
            const targetPhone = document.getElementById('hiddenPhone').value;

            try {
                const response = await fetch('/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: targetPhone, code: code })
                });

                const data = await response.json();

                if (response.ok) {
                    responseMessage.style.color = '#22c55e';
                    responseMessage.textContent = data.message || 'Succès !';
                    setTimeout(() => {
                        window.location.href = '/'; // Redirection après validation réussie
                    }, 2000);
                } else {
                    responseMessage.style.color = '#ef4444';
                    responseMessage.textContent = data.error || 'Code incorrect.';
                    verifyBtn.disabled = false;
                    verifyBtn.textContent = 'Valider le code';
                }
            } catch (error) {
                responseMessage.style.color = '#ef4444';
                responseMessage.textContent = 'Erreur de connexion au serveur.';
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Valider le code';
            }
        });
    </script>
</body>
</html>
